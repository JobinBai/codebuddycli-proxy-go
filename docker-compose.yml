services:
  codebuddycli-proxy:
    image: jobinbai/codebuddycli-proxy-go:latest
    environment:
      CODEBUDDY_API_KEY: "${CODEBUDDY_API_KEY:?Set CODEBUDDY_API_KEY in .env}"
      CODEBUDDY_INTERNET_ENVIRONMENT: "${CODEBUDDY_INTERNET_ENVIRONMENT:-internal}"
    ports:
      - "8787:8787"
    restart: unless-stopped
